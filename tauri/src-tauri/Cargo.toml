[package]
name = "pingora-desktop"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dbus = "0.9.12"
base64 = "0.23.1"
sha2 = "0.10.9"
url = "2"
rfd = "0.15.4"
ed25519-dalek = "2.2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
