name: Artifact transport probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: mkdir -p probe && printf 'pingora-artifact-probe\n' > probe/marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transport-host
          path: probe/marker.txt
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: transport-host
          path: restored
      - run: cmp probe/marker.txt restored/marker.txt
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    container:
      image: archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - run: mkdir -p probe && printf 'pingora-artifact-probe\n' > probe/marker.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: transport-container
          path: probe/marker.txt
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: transport-container
          path: restored
      - run: cmp probe/marker.txt restored/marker.txt
