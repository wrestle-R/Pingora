name: Native build and signed release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'tauri/**'
      - 'docs/releases/**'
      - '.github/workflows/native-release.yml'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - 'app/**'
      - 'tauri/**'
      - 'docs/releases/**'
      - '.github/workflows/native-release.yml'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host build dependencies (no signing credentials)
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/11/10/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git cmake ninja rust nodejs npm dbus pkgconf python jdk21-openjdk unzip curl openssl gettext gtk3 webkit2gtk-4.1 extra-cmake-modules qt6-base qt6-declarative qt6-wayland qt6-multimedia kstatusnotifieritem kcoreaddons kconfig kdbusaddons ki18n kiconthemes knotifications kio kcolorscheme kservice kirigami kpeople kwindowsystem kguiaddons kcrash kitemmodels kwidgetsaddons kpackage solid kirigami-addons qqc2-desktop-style wayland wayland-protocols libxkbcommon
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify installer boundary without release credentials
        run: |
          python3 docs/releases/tools/test-installer.py
          pingora_bootstrap=$(mktemp)
          trap 'rm -f "$pingora_bootstrap"' EXIT
          python3 docs/releases/tools/build-installer.py --output "$pingora_bootstrap"
          bash -n "$pingora_bootstrap"
      - name: Install pinned Android SDK
        run: python3 docs/releases/tools/setup-sdk.py
      - name: Verify checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Rust tests and Clippy
        run: python3 docs/releases/tools/build-release.py --stage rust
      - name: Android tests and optimized unsigned APK
        run: python3 docs/releases/tools/build-release.py --stage android
      - name: Build pinned native LAN service
        run: python3 docs/releases/tools/build-release.py --stage native
      - name: Build and verify Linux package
        run: python3 docs/releases/tools/build-release.py --stage linux
      - name: Assemble source and build provenance
        run: |
          python3 docs/releases/tools/build-release.py --stage inventory
          pacman -Q > release-private/unsigned/build-host-packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unsigned
          path: release-private/unsigned/
          retention-days: 7
          if-no-files-found: error
  sign:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'wrestle-R/Pingora'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: native-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-unsigned
          path: release-private/unsigned/
      - name: Verify tag belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned signing SDK
        run: python3 docs/releases/tools/setup-sdk.py
      - name: Materialize protected signing files
        env:
          KEYSTORE: ${{ secrets.PINGORA_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PINGORA_ANDROID_STORE_PASSWORD }}
          UPDATE_SIGNER: ${{ secrets.PINGORA_UPDATE_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('release-private/keys');p.mkdir(parents=True,mode=0o700)
          for name,content in [('android-release.p12',base64.b64decode(os.environ['KEYSTORE'],validate=True)),('android-store-password',os.environ['STORE_PASSWORD'].encode()),('update-ed25519.pem',os.environ['UPDATE_SIGNER'].encode())]:
              if not content:raise SystemExit('Required signing secret is absent')
              f=p/name;f.write_bytes(content);f.chmod(0o600)
          PY
      - name: Sign, verify and create complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 docs/releases/tools/sign-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-signed
          path: release-private/signed/
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral signing files
        if: always()
        run: rm -rf release-private/keys

  android-install:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-signed
          path: release-private/signed/
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK
        run: python3 docs/releases/tools/setup-sdk.py
      - name: Enable emulator acceleration
        run: |
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 docs/releases/tools/test-android-install.py --directory release-private/signed
